<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Waqti app icon (original): the day's arc over the horizon with the sun on it. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2350"/>
      <stop offset="0.55" stop-color="#3E4A89"/>
      <stop offset="1" stop-color="#B5485D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE6A8" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#F5C977" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F5C977" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9B872" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E9B872" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="480" fill="url(#sky)"/>
    <rect x="16" y="344" width="480" height="152" fill="url(#horizon)" opacity="0.6"/>
  </g>
  <path d="M96 352 A160 160 0 0 1 416 352" fill="none" stroke="#EAF2F8" stroke-width="22" stroke-linecap="round" opacity="0.92"/>
  <path d="M72 356 H440" stroke="#EAF2F8" stroke-width="12" stroke-linecap="round" opacity="0.35"/>
  <circle cx="340" cy="228" r="96" fill="url(#glow)"/>
  <circle cx="340" cy="228" r="44" fill="#F5D08A"/>
  <circle cx="340" cy="228" r="44" fill="none" stroke="#FFF4D6" stroke-width="6"/>
</svg>
