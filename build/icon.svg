<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32">
  <!-- The Waqti mark (original), one drawing for every size: the app and installer
       icons, the taskbar, the tray and the logo inside the app (NavIcons LogoMark).
       The day's arc over the horizon with the sun on it. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36428C"/>
      <stop offset="1" stop-color="#1D2459"/>
    </linearGradient>
    <radialGradient id="glow" cx="21" cy="14.5" r="8.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE6A8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFE6A8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#tile)"/>
  <circle cx="21" cy="14.5" r="8.5" fill="url(#glow)"/>
  <path d="M6 23 A10 10 0 0 1 26 23" fill="none" stroke="#EAF2F8" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="21" cy="14.5" r="4.2" fill="#F5D08A"/>
</svg>
